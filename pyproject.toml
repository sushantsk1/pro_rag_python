[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-rag-studio"
version = "0.2.0"
description = "Local document RAG with Python, LangChain, and a React dashboard"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2", "langchain>=1,<2", "langchain-community>=0.4,<0.5",
  "langchain-huggingface>=1,<2", "langchain-nvidia-ai-endpoints>=1.5,<2",
  "langchain-text-splitters>=1,<2", "sentence-transformers>=5,<6",
  "faiss-cpu>=1.10,<2", "rank-bm25>=0.2.2,<1", "numpy>=2,<3",
  "pypdf>=6,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2",
  "openpyxl>=3.1,<4", "beautifulsoup4>=4.13,<5", "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5"]
ocr = ["pypdfium2>=4,<6", "pytesseract>=0.3.13,<1", "Pillow>=11,<13"]

[project.scripts]
pro-rag = "server.main:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
